[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-aware-diffusion-decoding"
version = "0.1.0"
description = "Offline budget-aware continuation controllers for frozen diffusion language models"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{name = "Huseyn"}, {name = "Amin"}]
license-files = ["LICENSE", "ACKNOWLEDGEMENTS"]
dependencies = [
  "torch",
  "numpy>=1.26.0",
  "scikit-learn",
  "scipy",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "build>=1.2"]
research = [
  "torchvision",
  "torchaudio",
  "transformers==4.53.0",
  "accelerate==1.4.0",
  "peft==0.15.1",
  "trl==0.19.1",
  "deepspeed==0.16.4; platform_system == 'Linux'",
  "datasets==4.0.0",
  "tiktoken==0.9.0",
  "wandb>=0.16.0",
  "sentencepiece",
  "evaluate",
  "regex",
  "python-dotenv",
  "pandas",
  "s3fs",
  "matplotlib",
  "bitsandbytes==0.45.3; platform_system == 'Linux'",
]

[project.urls]
Repository = "https://github.com/Neytron557/budget-aware-diffusion-decoding"
Documentation = "https://github.com/Neytron557/budget-aware-diffusion-decoding/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["train*", "eval*", "common*", "data*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
